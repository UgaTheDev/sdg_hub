# SPDX-License-Identifier: Apache-2.0

name: E2E test

on:
  workflow_dispatch:
  push:

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0ac695c51e366938c
          ec2-instance-type: t3.small
          subnet-id: subnet-024298cefa3bedd61
          security-group-id: sg-06300447c4a5fbef3
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "ai-innovation-team-github-runner"},
              {"Key": "GitHubRepository", "Value": "${{ github.repository }}"}
            ]

  hello:
    name: Do the job on the runner
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Hello World
        run: |
          echo 'Hello World!'
          uname -a
          cat /etc/os-release
          df -h --print-type
          sudo dnf -y install fio fio-engine-libaio
          sudo mkdir /var/test
          # test throughput (sequential writes):
          sudo fio \
            --name=sequential_write \
            --directory=/var/test \
            --rw=write \
            --bs=1M \
            --size=10G \
            --numjobs=1 \
            --ioengine=libaio \
            --iodepth=64 \
            --direct=1 \
            --group_reporting \
            --runtime=60

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - hello
    runs-on: ubuntu-latest
    if: ${{ always() }}  # stop the runner even if the error happened in the previous jobs
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
